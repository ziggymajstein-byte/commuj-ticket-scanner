<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>COMMUJ Dinner & Awards — Ticket Check-In</title>
<script src="https://cdn.jsdelivr.net/npm/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<style>
*{box-sizing:border-box}body{
margin:0;
padding:20px;
font-family:Arial,sans-serif;
background:#f4f6f8;
color:#222;
}

  body::before{
content:"";
position:fixed;
inset:0;
background:url("https://raw.githubusercontent.com/ziggymajstein-byte/commuj-ticket-scanner/adaa5eb/Dinner_Logo__3_-removebg-preview.png") center 100% / 70vw auto no-repeat;
opacity:0.05;
pointer-events:none;
z-index:0;
}
  
.container{
max-width:520px;
margin:0 auto;
position:relative;
z-index:1;
}.header{text-align:center;margin-bottom:20px}.header h1{margin:0;font-size:25px}.header p{margin:7px 0;color:#666}
.card{
background:rgba(255,255,255,0.92);
padding:22px;
border-radius:14px;
box-shadow:0 2px 10px rgba(0,0,0,.08);
}
label{display:block;font-weight:700;margin:0 0 7px}select,input{width:100%;padding:13px;font-size:16px;border:1px solid #ccc;border-radius:8px;margin-bottom:14px;background:#fff}
button{width:100%;padding:14px;border:0;border-radius:8px;background:#1a73e8;color:#fff;font-size:16px;font-weight:700;cursor:pointer;margin-bottom:10px}
button.secondary{background:#666}.or{text-align:center;color:#777;margin:8px 0 14px}#reader{width:100%;margin:12px 0}
.result-box{padding:16px;border-radius:10px;margin-top:12px}.valid{background:#e6f4ea;border:1px solid #34a853}.warning{background:#fef7e0;border:1px solid #fbbc04}.invalid{background:#fce8e6;border:1px solid #ea4335}
.title{font-size:20px;font-weight:700;margin-bottom:10px}.token{word-break:break-all;font-family:monospace}
</style>
</head>
<body>
<div class="container">
<div class="header"><h1>COMMUJ FUNDRAISING DINNER AND AWARDS NIGHT 2026</h1>
<p>Dinner-Day Ticket Check-In</p></div>
<div class="card">

<div id="loginSection">

  <label for="staffId">Staff ID</label>
  <input
    id="staffId"
    type="text"
    placeholder="Enter your Staff ID"
    autocomplete="username"
  >

  <label for="staffPin">PIN</label>
  <input
    id="staffPin"
    type="password"
    placeholder="Enter your 6-digit PIN"
    inputmode="numeric"
    maxlength="6"
    autocomplete="current-password"
  >

  <button
    type="button"
    id="loginButton"
    onclick="loginCheckInStaff()"
  >
    🔐 LOGIN
  </button>

</div>

<div
  id="loggedInSection"
  style="display:none;"
>

  <div
    style="
      padding:12px;
      margin-bottom:15px;
      background:#e6f4ea;
      border:1px solid #34a853;
      border-radius:8px;
    "
  >
    <strong>✅ CHECK-IN STAFF LOGGED IN</strong><br>
    <span id="loggedInStaff"></span>
  </div>

  <button
    type="button"
    class="secondary"
    onclick="logoutCheckInStaff()"
  >
    🚪 LOG OUT
  </button>

</div>

<button type="button" id="startBtn" onclick="startScanner()">📷 SCAN QR CODE</button>
<div id="reader" style="display:none"></div>
<button type="button" id="stopBtn" class="secondary" style="display:none" onclick="stopScanner()">STOP CAMERA</button>

<div class="or">— OR ENTER TOKEN MANUALLY —</div>
<label for="token">QR Token</label>
<input id="token" type="text" placeholder="Enter QR token" autocomplete="off">

<button id="checkBtn" type="button" onclick="sendToCheckIn()">CHECK & CHECK-IN</button>

<button
  type="button"
  onclick="openPatron2CheckIn()"
>
  👥 PATRON 2 WITHOUT QR
</button>

<div class="or">OR — LOST TICKET / NO QR CODE</div>

<label for="lostName">Ticket Holder Name</label>
<input
  id="lostName"
  type="text"
  placeholder="Enter ticket holder's name"
  autocomplete="off"
>

<label for="lostPhone">Phone Number</label>
<input
  id="lostPhone"
  type="text"
  placeholder="Enter ticket holder's phone number"
  autocomplete="off"
>

<button
  type="button"
  id="findLostTicketButton"
  onclick="searchLostTicket()"
>
  🔎 FIND LOST TICKET
</button>
<div id="result"></div>
</div></div>

<script>
const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwZuHURuq1VAoEe9TeaP2kWXdV4j7nASFpDh5yRbtw3938VZSNL383rWs_9xE0cHCKjvg/exec";
let scanner=null, running=false;

const CHECKIN_SESSION_KEY = "commuj_checkin_session";

function loginCheckInStaff() {

  const staffId =
    document.getElementById("staffId")
      .value
      .trim();

  const pin =
    document.getElementById("staffPin")
      .value
      .trim();

  if (!staffId) {

    showResult(
      "warning",
      "⚠️ STAFF ID REQUIRED",
      "Enter your Staff ID."
    );

    return;
  }

  if (!/^\d{6}$/.test(pin)) {

    showResult(
      "warning",
      "⚠️ INVALID PIN",
      "PIN must be exactly 6 digits."
    );

    return;
  }

  const loginButton =
    document.getElementById("loginButton");

  loginButton.disabled = true;
  loginButton.textContent = "🔐 LOGGING IN...";

  showResult(
    "warning",
    "🔎 VERIFYING STAFF",
    "Checking your Staff ID and PIN."
  );

  const callbackName =
    "commujCheckInLoginCallback_" +
    Date.now();

  window[callbackName] =
    function(response) {

      try {

        if (
          !response ||
          !response.success
        ) {

          showResult(
            "invalid",
            "❌ LOGIN FAILED",
            escapeHtml(
              response &&
              response.message
                ? response.message
                : "Staff ID or PIN is incorrect."
            )
          );

          return;
        }

        if (!response.token) {

          showResult(
            "invalid",
            "❌ LOGIN FAILED",
            "No secure session was returned."
          );

          return;
        }

        const session = {

          token:
            response.token,

          staffId:
            response.staffId ||
            staffId,

          staffName:
            response.staffName ||
            ""

        };

        sessionStorage.setItem(
          CHECKIN_SESSION_KEY,
          JSON.stringify(session)
        );

        showLoggedInStaff(session);

        document.getElementById("staffPin").value = "";

        showResult(
          "valid",
          "✅ LOGIN SUCCESSFUL",
          "You are now authorized to check in tickets."
        );

      } finally {

        delete window[callbackName];

        loginButton.disabled = false;
        loginButton.textContent = "🔐 LOGIN";

      }

    };

  const script =
    document.createElement("script");

  script.src =
    APPS_SCRIPT_URL +
    "?action=checkInLogin" +
    "&staffId=" +
    encodeURIComponent(staffId) +
    "&pin=" +
    encodeURIComponent(pin) +
    "&callback=" +
    encodeURIComponent(callbackName) +
    "&t=" +
    Date.now();

  script.onerror =
    function() {

      delete window[callbackName];

      loginButton.disabled = false;
      loginButton.textContent = "🔐 LOGIN";

      showResult(
        "invalid",
        "❌ CONNECTION ERROR",
        "Unable to connect to the check-in system."
      );

    };

  document.body.appendChild(script);

}


function showLoggedInStaff(session) {

  document.getElementById("loginSection")
    .style.display = "none";

  document.getElementById("loggedInSection")
    .style.display = "block";

  document.getElementById("loggedInStaff")
    .textContent =
      session.staffId +
      " — " +
      session.staffName;

}


function restoreCheckInSession() {

  const stored =
    sessionStorage.getItem(
      CHECKIN_SESSION_KEY
    );

  if (!stored) {
    return;
  }

  let session;

  try {

    session =
      JSON.parse(stored);

  } catch (error) {

    sessionStorage.removeItem(
      CHECKIN_SESSION_KEY
    );

    return;

  }

  if (
    !session ||
    !session.token
  ) {

    sessionStorage.removeItem(
      CHECKIN_SESSION_KEY
    );

    return;

  }

  showLoggedInStaff(session);

}


function logoutCheckInStaff() {

  sessionStorage.removeItem(
    CHECKIN_SESSION_KEY
  );

  document.getElementById("loginSection")
    .style.display = "block";

  document.getElementById("loggedInSection")
    .style.display = "none";

  document.getElementById("staffId").value = "";
  document.getElementById("staffPin").value = "";

  document.getElementById("result").innerHTML = "";

}


window.addEventListener(
  "DOMContentLoaded",
  function() {

    restoreCheckInSession();

  }
);
 
function showResult(type,title,message){
 document.getElementById("result").innerHTML='<div class="result-box '+type+'"><div class="title">'+title+'</div><div>'+message+'</div></div>';
}

function startScanner(){
 const staff=document.getElementById("staffName").value;
 if(!staff){showResult("warning","⚠️ SELECT STAFF","Choose the staff member before scanning.");return;}
 document.getElementById("result").innerHTML="";
 document.getElementById("reader").style.display="block";
 document.getElementById("startBtn").style.display="none";
 document.getElementById("stopBtn").style.display="block";
 scanner=new Html5Qrcode("reader");
 scanner.start({facingMode:"environment"},{fps:10,qrbox:{width:250,height:250}},function(decodedText){
   document.getElementById("token").value=decodedText;
   stopScanner();
   showResult("valid","✅ QR CODE SCANNED",'Token detected: <span class="token">'+escapeHtml(decodedText)+'</span><br><br>Review it, then press <strong>CHECK & CHECK-IN</strong>.');
 },function(){}).then(function(){running=true;}).catch(function(error){
   document.getElementById("reader").style.display="none";
   document.getElementById("startBtn").style.display="block";
   document.getElementById("stopBtn").style.display="none";
   showResult("invalid","❌ CAMERA ERROR","The camera could not be started. Make sure camera permission is allowed.");
   console.error(error);
 });
}

function stopScanner(){
 if(scanner&&running){
   scanner.stop().then(function(){
     running=false;
     document.getElementById("reader").style.display="none";
     document.getElementById("startBtn").style.display="block";
     document.getElementById("stopBtn").style.display="none";
   }).catch(function(error){console.error(error);});
 }else{
   document.getElementById("reader").style.display="none";
   document.getElementById("startBtn").style.display="block";
   document.getElementById("stopBtn").style.display="none";
 }
}

function sendToCheckIn() {

  const sessionData =
    sessionStorage.getItem(
      CHECKIN_SESSION_KEY
    );

  if (!sessionData) {

    showResult(
      "warning",
      "🔐 LOGIN REQUIRED",
      "Please log in with your Staff ID and PIN before checking in tickets."
    );

    return;
  }

  let session;

  try {

    session =
      JSON.parse(sessionData);

  } catch (error) {

    sessionStorage.removeItem(
      CHECKIN_SESSION_KEY
    );

    showResult(
      "warning",
      "🔐 LOGIN REQUIRED",
      "Your login session is invalid. Please log in again."
    );

    return;
  }

  if (
    !session ||
    !session.token
  ) {

    sessionStorage.removeItem(
      CHECKIN_SESSION_KEY
    );

    showResult(
      "warning",
      "🔐 LOGIN REQUIRED",
      "Your login session is invalid. Please log in again."
    );

    return;
  }

  const token =
    document.getElementById("token")
      .value
      .trim();

  if (!token) {

    showResult(
      "warning",
      "⚠️ NO QR TOKEN",
      "Scan a QR code or enter a token manually."
    );

    return;
  }

  if (
    APPS_SCRIPT_URL.indexOf("PASTE_YOUR") === 0
  ) {

    showResult(
      "invalid",
      "⚠️ SETUP REQUIRED",
      "The Apps Script Web App URL has not been added to the scanner yet."
    );

    return;
  }

  /*
   * Send the QR token and secure session
   * to Apps Script.
   *
   * Staff identity is determined
   * server-side from the session token.
   */

  window.location.href =
    APPS_SCRIPT_URL +
    "?action=checkin" +
    "&token=" +
    encodeURIComponent(token) +
    "&sessionToken=" +
    encodeURIComponent(session.token);

}

function openPatron2CheckIn() {

  const staff =
    document
      .getElementById("staffName")
      .value
      .trim();

  if (!staff) {

    showResult(
      "warning",
      "⚠️ SELECT STAFF",
      "Choose the staff member first."
    );

    return;

  }


  document.getElementById("result").innerHTML = `

    <div class="result-box warning">

      <div class="title">
        👥 PATRON 2 WITHOUT QR
      </div>

      <div style="margin-bottom:15px;">
        Enter the details exactly as registered
        for Patron 2 on the Double Patron ticket.
      </div>

      <label for="patron2ArrivalName">
        Patron 2 Name
      </label>

      <input
        id="patron2ArrivalName"
        type="text"
        placeholder="Enter Patron 2 name"
        autocomplete="off"
      >

      <label for="patron2ArrivalPhone">
        Patron 2 Phone Number
      </label>

      <input
        id="patron2ArrivalPhone"
        type="text"
        placeholder="Enter Patron 2 phone number"
        autocomplete="off"
      >

      <button
        type="button"
        onclick="submitPatron2WithoutQr()"
      >
        ✅ VERIFY & CHECK-IN
      </button>

      <button
        type="button"
        class="secondary"
        onclick="clearPatron2CheckIn()"
        style="margin-top:8px;"
      >
        CANCEL
      </button>

    </div>

  `;

  document
    .getElementById("patron2ArrivalName")
    .focus();

}

function submitPatron2WithoutQr() {

  const staff =
    document
      .getElementById("staffName")
      .value
      .trim();

  const arrivalName =
    document
      .getElementById("patron2ArrivalName")
      .value
      .trim();

  const arrivalPhone =
    document
      .getElementById("patron2ArrivalPhone")
      .value
      .trim();


  if (!staff) {

    showResult(
      "warning",
      "⚠️ SELECT STAFF",
      "Choose the staff member first."
    );

    return;

  }


  if (!arrivalName) {

    showResult(
      "warning",
      "⚠️ NAME REQUIRED",
      "Enter Patron 2's name."
    );

    return;

  }


  if (!arrivalPhone) {

    showResult(
      "warning",
      "⚠️ PHONE REQUIRED",
      "Enter Patron 2's phone number."
    );

    return;

  }


  showResult(
    "warning",
    "🔎 VERIFYING PATRON 2...",
    "Checking the Double Patron ticket database."
  );


  const callbackName =
    "commujDoublePatronCallback_" +
    Date.now();


  window[callbackName] =
    function(response) {

      try {

        if (
          response &&
          response.success
        ) {

          showResult(
            "valid",
            "✅ ENTRY APPROVED",
            "Patron 2 has been successfully checked in."
          );

          return;

        }


        showResult(
          response &&
          response.result === "ALREADY_USED"
            ? "warning"
            : "invalid",
          response &&
          response.result === "ALREADY_USED"
            ? "⚠️ ALREADY USED"
            : "❌ VERIFICATION FAILED",
          escapeHtml(
            response &&
            response.message
              ? response.message
              : "Patron 2 could not be verified."
          )
        );

      } finally {

        delete window[callbackName];

      }

    };


  const script =
    document.createElement("script");


  script.src =
    APPS_SCRIPT_URL +
    "?action=doublePatronWithoutQr" +
    "&arrivalName=" +
    encodeURIComponent(arrivalName) +
    "&arrivalPhone=" +
    encodeURIComponent(arrivalPhone) +
    "&staff=" +
    encodeURIComponent(staff) +
    "&callback=" +
    encodeURIComponent(callbackName) +
    "&t=" +
    Date.now();


  script.onerror =
    function() {

      delete window[callbackName];

      showResult(
        "invalid",
        "❌ CONNECTION ERROR",
        "Unable to connect to the ticket database."
      );

    };


  document
    .body
    .appendChild(script);

}

function clearPatron2CheckIn() {

  document.getElementById("result").innerHTML = "";

}  
  
function searchLostTicket() {

  const holderName =
    document.getElementById("lostName").value.trim();

  const phone =
    document.getElementById("lostPhone").value.trim();

  const staff =
    document.getElementById("staffName").value.trim();

  if (!staff) {

    showResult(
      "warning",
      "⚠️ SELECT STAFF",
      "Choose the staff member first."
    );

    return;
  }

  if (!holderName) {

    showResult(
      "warning",
      "⚠️ HOLDER NAME REQUIRED",
      "Enter the ticket holder's name."
    );

    return;
  }

  if (!phone) {

    showResult(
      "warning",
      "⚠️ PHONE NUMBER REQUIRED",
      "Enter the phone number used when the ticket was sold."
    );

    return;
  }


  showResult(
    "warning",
    "🔎 SEARCHING...",
    "Checking the ticket database."
  );


  const callbackName =
    "commujLostTicketCallback_" +
    Date.now();


  window[callbackName] =
    function(response) {

      try {

        if (!response || !response.success) {

          showResult(
            "invalid",
            "❌ TICKET NOT FOUND",
            escapeHtml(
              response &&
              response.message
                ? response.message
                : "No matching ticket was found."
            )
          );

          return;
        }


        if (!response.ticket) {

          showResult(
            "invalid",
            "❌ TICKET NOT FOUND",
            "No ticket information was returned."
          );

          return;
        }


        showLostTicketConfirmation(
          response.ticket
        );

      } finally {

        delete window[callbackName];

      }

    };


  const script =
    document.createElement("script");


  script.src =
    APPS_SCRIPT_URL +
    "?action=lostTicketSearch" +
    "&holderName=" +
    encodeURIComponent(holderName) +
    "&phone=" +
    encodeURIComponent(phone) +
    "&callback=" +
    encodeURIComponent(callbackName) +
    "&t=" +
    Date.now();


  script.onerror =
    function() {

      delete window[callbackName];

      showResult(
        "invalid",
        "❌ SEARCH ERROR",
        "Unable to connect to the ticket database."
      );

    };


  document.body.appendChild(script);

}

  function showLostTicketConfirmation(ticket) {

  const result =
    document.getElementById("result");

  const staff =
    document.getElementById("staffName").value.trim();


  result.innerHTML =

    '<div class="result-box warning">' +

      '<div class="title">' +
        '🎫 LOST TICKET FOUND' +
      '</div>' +

      '<div style="line-height:1.7;">' +

        '<strong>Ticket:</strong> ' +
        escapeHtml(ticket.ticketId) +
        '<br>' +

        '<strong>Category:</strong> ' +
        escapeHtml(ticket.category) +
        '<br>' +

        '<strong>Holder:</strong> ' +
        escapeHtml(ticket.holderName) +
        '<br>' +

        '<strong>Phone:</strong> ' +
        escapeHtml(ticket.phone) +
        '<br>' +

        '<strong>Amount:</strong> NLe ' +
        escapeHtml(String(ticket.amount)) +
        '<br>' +

        '<strong>Payment:</strong> ' +
        escapeHtml(ticket.paymentStatus) +
        '<br>' +

        '<strong>Status:</strong> ' +
        escapeHtml(ticket.ticketStatus) +

      '</div>' +

      '<div style="' +
        'margin-top:15px;' +
        'padding:12px;' +
        'background:#fef7e0;' +
        'border:1px solid #fbbc04;' +
        'border-radius:8px;' +
      '">' +

        '⚠️ <strong>QR CODE NOT PRESENT</strong><br>' +
        'Verify the information above before confirming entry.' +

      '</div>' +

      '<button ' +
        'type="button" ' +
        'id="confirmLostTicketButton" ' +
        'onclick="confirmLostTicketCheckIn()"' +
      '>' +

        '✅ CONFIRM LOST-TICKET CHECK-IN' +

      '</button>' +

    '</div>';

}

function confirmLostTicketCheckIn() {

  const holderName =
    document.getElementById("lostName").value.trim();

  const phone =
    document.getElementById("lostPhone").value.trim();

  const staff =
    document.getElementById("staffName").value.trim();


  if (!staff) {

    showResult(
      "warning",
      "⚠️ SELECT STAFF",
      "Choose the staff member first."
    );

    return;
  }


  if (!holderName || !phone) {

    showResult(
      "warning",
      "⚠️ INFORMATION MISSING",
      "The holder name and phone number are required."
    );

    return;
  }


  showResult(
    "warning",
    "⏳ CHECKING IN...",
    "Re-checking the ticket before recording entry."
  );


  const callbackName =
    "commujLostTicketCheckInCallback_" +
    Date.now();


  window[callbackName] =
    function(response) {

      try {

        if (!response || !response.success) {

          showResult(
            "invalid",
            "❌ CHECK-IN FAILED",
            escapeHtml(
              response &&
              response.message
                ? response.message
                : "The lost ticket could not be checked in."
            )
          );

          return;
        }


        const ticket =
          response.ticket;


        if (!ticket) {

          showResult(
            "invalid",
            "❌ CHECK-IN FAILED",
            "No ticket information was returned."
          );

          return;
        }


        showResult(
          "valid",
          "✅ LOST TICKET CHECKED IN",
          '<strong>Ticket:</strong> ' +
          escapeHtml(ticket.ticketId) +
          '<br><strong>Holder:</strong> ' +
          escapeHtml(ticket.holderName) +
          '<br><strong>Category:</strong> ' +
          escapeHtml(ticket.category) +
          '<br><strong>Payment:</strong> ' +
          escapeHtml(ticket.paymentStatus) +
          '<br><strong>Status:</strong> USED' +
          '<br><strong>Entry Staff:</strong> ' +
          escapeHtml(ticket.entryStaff)
        );


        /*
         * Clear the lost-ticket fields after
         * successful check-in.
         */

        document.getElementById("lostName").value = "";
        document.getElementById("lostPhone").value = "";


      } finally {

        delete window[callbackName];

      }

    };


  const script =
    document.createElement("script");


  script.src =
    APPS_SCRIPT_URL +
    "?action=lostTicketCheckin" +
    "&holderName=" +
    encodeURIComponent(holderName) +
    "&phone=" +
    encodeURIComponent(phone) +
    "&staff=" +
    encodeURIComponent(staff) +
    "&callback=" +
    encodeURIComponent(callbackName) +
    "&t=" +
    Date.now();


  script.onerror =
    function() {

      delete window[callbackName];

      showResult(
        "invalid",
        "❌ CHECK-IN ERROR",
        "Unable to connect to the ticket database."
      );

    };


  document.body.appendChild(script);

}
  
function escapeHtml(value){
 return String(value).replace(/[&<>"']/g,function(ch){return({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'})[ch];});
}
</script>
</body>
</html>
